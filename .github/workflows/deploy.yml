name: Deploy to GitHub Pages

# Note: GitHub is currently updating actions/checkout, actions/setup-node, and actions/upload-artifact
# to support Node.js 24. The deprecation warning about Node.js 20 will resolve automatically
# when GitHub finishes their rollout. The app is already configured for Node.js 24.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Verify Supabase Configuration
        run: |
          echo "Checking build output for Supabase configuration..."
          if grep -q "VITE_SUPABASE_URL" dist/assets/*.js 2>/dev/null || grep -q "VITE_SUPABASE_PUBLISHABLE_KEY" dist/assets/*.js 2>/dev/null; then
            echo "✅ Supabase environment variables found in build"
          else
            echo "⚠️ Warning: Supabase environment variables may not be properly configured"
            echo "Please ensure GitHub secrets are set: VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4